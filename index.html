<style>
:root{--ink:#1d1233;--panel:#2b1c4d;--line:#4a3580;--cream:#f6efff;--pink:#ff5d8f;--mint:#5ef0c0;--butter:#ffe36e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--cream);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.5}
body{display:flex;justify-content:center;padding:16px 14px 40px;background:radial-gradient(circle at 20% 0%,#3a2470 0,transparent 45%),var(--ink)}
.px{font-family:'Press Start 2P',ui-monospace,monospace;line-height:1.6}
main{width:100%;max-width:520px}
#cast{display:block;width:100%;max-width:300px;margin:0 auto 8px}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 #0e0820;padding:22px 20px}
h1{font-size:19px;margin:0 0 16px;color:var(--butter);text-shadow:3px 3px 0 var(--pink)}
h2{font-size:14px;margin:0 0 12px;color:var(--butter)}
p{margin:0 0 14px}
.small{font-size:15px;opacity:.8}
button{font:inherit;font-weight:800;cursor:pointer;color:var(--ink);background:var(--butter);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--pink);padding:12px 18px;margin:4px 6px 4px 0;transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--pink)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.alt{background:var(--cream)}
.opts{display:grid;gap:10px;margin:14px 0}
.opts button{text-align:left;margin:0;width:100%}
.nx{font-weight:600;font-size:15px;opacity:.65}
#hrt{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ====== EDIT THESE ====== */
const CFG = {
  myName: "Eduardo",
  whatsapp: "",   // your number, digits only with country code, e.g. "31612345678" (leave "" to hide button)
  email: "",      // your email (leave "" to hide button)
  ntfyTopic: "edualerts22",  // auto-send as a push notification, e.g. "lvl2-8f3k2x9qzp41" (long random name; subscribe in the ntfy app)
  formEndpoint: ""// auto-send by email via Formspree, e.g. "https://formspree.io/f/abcdwxyz"
};
const AUTO = !!(CFG.ntfyTopic || CFG.formEndpoint);
/* ======================== */

const her = "Mascha";
const TITLE = "We should definitely see each other again";
const $ = s => document.querySelector(s);
const stage = $("#stage");
const S = {verdict:"", setting:""};
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = html => { stage.innerHTML = html; window.scrollTo(0,0); };
const heart = on => { $("#hrt").style.display = on ? "" : "none"; };
const msg = () => `${TITLE} 🎮\nRound 2? ${S.verdict}` + (S.setting ? `\nSetting: ${S.setting}` : "") + `\n- ${her}`;

async function autoSend(m){
  const jobs = [];
  if (CFG.ntfyTopic) jobs.push(fetch("https://ntfy.sh/"+CFG.ntfyTopic, {method:"POST", body:m, headers:{"Title":"Round 2 results"}}));
  if (CFG.formEndpoint) jobs.push(fetch(CFG.formEndpoint, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify({message:m, from:her})}));
  if (!(await Promise.all(jobs)).every(r => r.ok)) throw new Error("send failed");
}
function manual(m){
  const enc = encodeURIComponent(m);
  return `${CFG.whatsapp ? `<a href="https://wa.me/${CFG.whatsapp}?text=${enc}"><button>Send on WhatsApp</button></a>` : ""}
    ${CFG.email ? `<a href="mailto:${CFG.email}?subject=${encodeURIComponent("Round 2?")}&body=${enc}"><button>Send by email</button></a>` : ""}
    <button class="alt" id="cp">Copy my answer</button>${navigator.share ? `<button class="alt" id="sh">Share...</button>` : ""}`;
}
function wire(m){
  $("#cp").onclick = async e => { try { await navigator.clipboard.writeText(m); e.target.textContent = "Copied!"; } catch { e.target.textContent = "Copy failed"; } };
  if ($("#sh")) $("#sh").onclick = () => navigator.share({text:m}).catch(()=>{});
}
function finish(html){
  const m = msg();
  show(`${html}<p class="small" id="status">${AUTO ? "📨 Sending your answer to "+CFG.myName+"..." : "Last step: send me your answer."}</p><div id="manual">${AUTO ? "" : manual(m)}</div>`);
  if (!AUTO) return wire(m);
  autoSend(m).then(
    () => { $("#status").textContent = "Answer sent to "+CFG.myName+" ✓"; },
    () => { $("#status").textContent = "Couldn't send automatically. Please send it with one of these:"; $("#manual").innerHTML = manual(m); wire(m); });
}

function s1(){
  heart(true);
  show(`<p style="font-size:21px"><b>I hope you are not hungover and are feeling fresh at 7am.</b></p>
    <h1 class="px">${TITLE}</h1>
    <p style="font-size:21px"><b>Otherwise, I will be thinking of this kiss forever.</b></p>
    <button class="px" style="font-size:12px" id="n">NEXT</button>`);
  $("#n").onclick = s2;
}

function s2(){
  heart(true);
  show(`<h2 class="px">ROUND 2?</h2><p><b>Would you like to go for a round 2?</b></p>
    <div class="opts"><button id="y">💚 Yes. <span class="nx">-next screen-</span></button><button id="no">No. <span class="nx">-next screen-</span></button><button id="m">I need to think about it</button></div>
    ${AUTO ? `<p class="small">📨 Your answer is sent to ${CFG.myName} automatically as soon as you pick one.</p>` : ""}`);
  $("#y").onclick = () => { S.verdict = "Yes"; quiz(); };
  $("#no").onclick = () => { S.verdict = "No"; heart(false);
    finish(`<p style="font-size:20px"><b>I still enjoyed seeing you the other day a lot, I wish you the best :)</b></p>`); };
  $("#m").onclick = () => { S.verdict = "I need to think about it"; heart(true);
    if (AUTO) autoSend(msg()).catch(()=>{});
    show(`<h2 class="px">NO RUSH</h2><p>Take all the time you need. Whenever you are ready, fill in the quiz.</p>
      ${AUTO ? `<p class="small">📨 I let ${CFG.myName} know you need to think about it.</p>` : ""}
      <button id="rd">I'm ready, show me the quiz</button>`);
    $("#rd").onclick = quiz; };
}

function quiz(){
  heart(true);
  const o = ["A set of open questions I still would like to ask you, in a warm setting (no PowerPoint this time, but there will be a list! 📙)",
             "No more serious talk at least for now, we need to bring back the fun ✨",
             "Something we have never done before 😏",
             "We can start with a coffee ☕"];
  show(`<h2 class="px">THE QUIZ</h2><p><b>What setting would you prefer?</b></p>
    <div class="opts">${o.map(x => `<button>${esc(x)}</button>`).join("")}</div>
    ${AUTO ? `<p class="small">📨 Your answer is sent to ${CFG.myName} automatically as soon as you pick one.</p>` : ""}`);
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => { S.setting = b.textContent;
    finish(`<h2 class="px">DEAL</h2><p style="font-size:20px"><b>Perfect. I'll take it from here 😉</b></p>`); });
}

s1();
</script>
